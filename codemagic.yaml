workflows:
  android-workflow:
    name: Android Build
    environment:
      flutter: default
    scripts:
      - name: Fix Gradle (Recreate Android folder)
        script: |
          rm -rf android
          flutter create .
      - name: Get packages
        script: flutter pub get
      - name: Build APK (Debug Mode)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
